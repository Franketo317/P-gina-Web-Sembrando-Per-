name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          node -e '
            fetch("https://jiserranntipokqubswo.supabase.co/rest/v1/")
              .then(res => console.log("Supabase Ping Status:", res.status))
              .catch(err => { console.error(err); process.exit(1); });
          '
